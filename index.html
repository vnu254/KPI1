<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trắc nghiệm ĐLQLBĐ</title>
<style>
*{
    box-sizing:border-box;
}
body{
    font-family:Arial, sans-serif;
    background:#f1f5f9;
    padding:12px;
    margin:0;
}
.container{
    width:100%;
    max-width:900px;
    margin:auto;
    background:white;
    padding:16px;
    border-radius:15px;
    box-shadow:0 5px 20px #0002;
}
h1{
    text-align:center;
    color:#1d4ed8;
    font-size:clamp(20px,5vw,32px);
    line-height:1.3;
    margin:10px 0 20px;
}
.mode{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:15px 0;
}
button{
    width:100%;
    padding:14px 12px;
    border:0;
    border-radius:12px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-size:16px;
    min-height:48px;
}
.question{
    background:#f8fafc;
    padding:14px;
    border-radius:12px;
    margin:15px 0;
    font-size:16px;
    line-height:1.5;
}
.option{
    display:block;
    width:100%;
    padding:14px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
    line-height:1.5;
    background:white;
    word-break:break-word;
}
.correct{
    background:#dcfce7;
    border-color:#16a34a;
}
.wrong{
    background:#fee2e2;
    border-color:#dc2626;
}
#single{
    text-align:center;
}

/* tối ưu cho màn hình nhỏ */
@media (max-width:480px){
    body{
        padding:8px;
    }
    .container{
        padding:12px;
        border-radius:12px;
    }
    .question{
        padding:12px;
        font-size:15px;
    }
    .option{
        padding:12px;
        font-size:14px;
    }
    button{
        font-size:15px;
    }
}
</style>
</head>

<body>
<div class="container">
<h1>ÔN TẬP TRẮC NGHIỆM ĐLQLBĐ</h1>

<div class="mode">
<button onclick="startSingle()">Làm từng câu - biết kết quả ngay</button>
<button onclick="startAll()">Làm toàn bộ bài</button>
</div>

<div id="quiz"></div>
<div id="result"></div>
</div>

<script>
let questions=[{"question": "Câu 1: Đ/c cho biết theo Điều lệnh quản lý bộ đội Quân đội Nhân dân Việt Nam xuất bản năm 2026 quy định trang phục quân đội gồm mấy loại?", "options": ["a) 3 loại.", "b) 4 loại.", "c) 5 loại.", "d) 6 loại."], "answer": "c) 5 loại."}, {"question": "Câu 2: Đ/c hãy cho biết theo Điều lệnh quản lý bộ đội Quân đội Nhân dân Việt Nam xuất bản năm 2026, khái niệm nào sau đây là đúng?", "options": ["a) Quan hệ cấp trên, cấp dưới thuộc quyền là quan hệ giữa người chỉ huy và đơn vị thuộc quyền.", "b) Quan hệ cấp trên, cấp dưới thuộc quyền là quan hệ giữa quân nhân giữ chức vụ chỉ huy một đơn vị nhất định với mọi quân nhân thuộc biên chế trong đơn vị đó. Người chỉ huy và chính ủy, chính trị viên gần nhất là cấp trên trực tiếp.", "c) Quan hệ cấp trên, cấp dưới thuộc quyền là quan hệ giữa quân nhân giữ chức vụ chỉ huy với cơ quan, đơn vị.", "d) Quan hệ cấp trên, cấp dưới thuộc quyền là quan hệ giữa người chỉ huy với cơ quan, đơn vị."], "answer": "b) Quan hệ cấp trên, cấp dưới thuộc quyền là quan hệ giữa quân nhân giữ chức vụ chỉ huy một đơn vị nhất định với mọi quân nhân thuộc biên chế trong đơn vị đó. Người chỉ huy và chính ủy, chính trị viên gần nhất là cấp trên trực tiếp."}, {"question": "Câu 3: Điều 32 - Điều lệnh QLBĐ QĐND Việt Nam quy định: Trong các mối quan hệ:", "options": ["a) Phải giữ gìn phẩm chất đạo đức cách mạng và nghiêm chỉnh tuân theo những yêu cầu của sinh hoạt xã hội.", "b) Phải có tinh thần thần đoàn kết đồng chí, đồng đội, giữ gìn phẩm chất đạo đức cách mạng và nghiêm chỉnh tuân theo những yêu cầu của sinh hoạt xã hội.", "c) Quân nhân phải giữ gìn phẩm chất đạo đức cách mạng; gương mẫu chấp hành pháp luật Nhà nước và những quy tắc sinh hoạt xã hội.", "d) Phải kính trọng người già, yêu mến trẻ em, tôn trọng phụ nữ."], "answer": "c) Quân nhân phải giữ gìn phẩm chất đạo đức cách mạng; gương mẫu chấp hành pháp luật Nhà nước và những quy tắc sinh hoạt xã hội."}, {"question": "Câu 4: Điều 32 - Điều lệnh QLBĐ QĐND Việt Nam quy định: Một trong những nội dung phong cách quân nhân:", "options": ["a) Tự giác chấp hành nghiêm kỷ luật của Quân đội và mệnh lệnh, chỉ thị của cấp trên.", "b) Có ý thức tổ chức kỷ luật, có tinh thần đoàn kết, tương trợ và có nếp sống văn minh, lành mạnh.", "c) Có ý thức tổ chức kỷ luật, có tinh thần đoàn kết, tương trợ giúp đỡ lẫn nhau và có nếp sống văn minh, lành mạnh."], "answer": "b) Có ý thức tổ chức kỷ luật, có tinh thần đoàn kết, tương trợ và có nếp sống văn minh, lành mạnh."}, {"question": "Câu 5: Điều 32   - Điều lệnh QLBĐ QĐND Việt Nam quy định: Quân nhân", "options": ["a)  Đầu tóc phải gọn gàng, không xăm chàm trên thân thể, chỉ được nhuộm tóc màu đen.", "b) Đầu tóc phải gọn gàng, chỉ được nhuộm tóc màu đen; nam quân nhân tóc mai, tóc gáy cắt ngắn (HSQ - CS cắt tóc 3 phân), không để râu, ria; Nữ quân nhân khi mặc quân phục phải búi tóc gọn gàng sau gáy, búi tóc được buộc trong túi lưới màu đen, không ảnh hưởng tới tác phong khi đội mũ. Không đeo phụ kiện trang trí lên đầu tóc; không đeo kính màu (trừ trường hợp công tác đặc biệt hoặc người có bệnh lý về mắt theo chỉ định của bác sĩ).", "c)  Nam quân nhân tóc mai, tóc gáy cắt ngắn, không để râu. Nữ quân nhân khi mặc quân phục phải búi tóc gọn gàng sau gáy, búi tóc được buộc trong túi lưới màu đen, không ảnh hưởng tới tác phong khi đội mũ.", "d)  Cả ba quy định trên."], "answer": "b) Đầu tóc phải gọn gàng, chỉ được nhuộm tóc màu đen; nam quân nhân tóc mai, tóc gáy cắt ngắn (HSQ - CS cắt tóc 3 phân), không để râu, ria; Nữ quân nhân khi mặc quân phục phải búi tóc gọn gàng sau gáy, búi tóc được buộc trong túi lưới màu đen, không ảnh hưởng tới tác phong khi đội mũ. Không đeo phụ kiện trang trí lên đầu tóc; không đeo kính màu (trừ trường hợp công tác đặc biệt hoặc người có bệnh lý về mắt theo chỉ định của bác sĩ)."}, {"question": "Câu 6. Điều 43 Mục 1 Chương IV - Điều lệnh QLBĐ QĐND Việt Nam, thời gian làm việc của mùa nóng được quy định trong khoảng nào?", "options": ["a) Mùa nóng từ ngày 01 tháng 5 đến 31 tháng 10", "b) Mùa nóng từ ngày 01 tháng 4 đến 30 tháng 9", "c) Mùa nóng từ ngày 15 tháng 4 đến 15 tháng 10", "d) Mùa nóng từ ngày 01 tháng 4 đến 31 tháng 10"], "answer": "d) Mùa nóng từ ngày 01 tháng 4 đến 31 tháng 10"}, {"question": "Câu 7: Mục 2 - Chương IV - Điều lệnh QLBĐ QĐND Việt Nam quy định:  Thứ tự các chế độ trong ngày:", "options": ["a) Treo Quốc kỳ. Thức dậy. Thể dục sáng. Kiểm tra sáng. Ăn uống. Học tập. Bảo quản VK, khí tài, trang bị. Thể thao TGSX. Đọc báo, nghe tin. Điểm danh, điểm quân số. Ngủ nghỉ.", "b) Treo Quốc kỳ. Thức dậy. Thể dục sáng. Kiểm tra sáng. Học tập. Ăn uống. Bảo quản VK, khí tài, trang bị. Thể thao TGSX. Đọc báo, nghe tin. Điểm danh, điểm quân số. Ngủ nghỉ.", "c) Treo Quốc kỳ. Thức dậy. Thể dục sáng. Kiểm tra sáng. Ăn uống. Học tập. Ăn uống. Thể thao TGSX. Bảo quản VK, khí tài, trang bị. Đọc báo, nghe tin. Điểm danh, điểm quân số. Ngủ nghỉ.", "d) Treo Quốc kỳ. Thức dậy. Thể dục sáng. Kiểm tra sáng. Học tập. Ăn uống. Bảo quản VK trang bị kỹ thuật. Thể thao TGSX. Đọc báo, nghe tin, xem truyền hình. Điểm danh, điểm quân số. Ngủ nghỉ."], "answer": "d) Treo Quốc kỳ. Thức dậy. Thể dục sáng. Kiểm tra sáng. Học tập. Ăn uống. Bảo quản VK trang bị kỹ thuật. Thể thao TGSX. Đọc báo, nghe tin, xem truyền hình. Điểm danh, điểm quân số. Ngủ nghỉ."}, {"question": "Câu 8. Điều 47 Mục 2 Chương IV - Điều lệnh QLBĐ QĐND Việt Nam, thời gian kiểm tra sáng hằng ngày được quy định là:", "options": ["a) Thời gian kiểm tra 10 phút", "b) Thời gian kiểm tra 15 phút", "c) Thời gian kiểm tra 20 phút", "d) Thời gian kiểm tra 25 phút"], "answer": "a) Thời gian kiểm tra 10 phút"}, {"question": "Câu 9: Điều 56 - Điều lệnh QLBĐ QĐND Việt Nam quy định:  Chế độ thông báo chính trị đối với sĩ quan, QNCN, công nhân và viên chức quốc phòng hàng tháng:", "options": ["a) 2 lần (02 giờ)/ tháng được tính vào thời gian làm việc chính thức do cấp trung đoàn và tương đương trở lên tổ chức.", "b) 2 lần (01 giờ)/ tháng không tính vào thời gian làm việc chính thức do cấp trung đoàn và tương đương trở lên tổ chức.", "c) 1 lần (02 giờ)/ tháng không tính vào thời gian làm việc chính thức do cấp trung đoàn và tương đương trở lên tổ chức.", "d) 1 lần (01 giờ)/ tháng không tính vào thời gian làm việc chính thức do cấp trung đoàn và tương đương trở lên tổ chức."], "answer": "c) 1 lần (02 giờ)/ tháng không tính vào thời gian làm việc chính thức do cấp trung đoàn và tương đương trở lên tổ chức."}, {"question": "Câu 10: Điều 69 - Điều lệnh QLBĐ QĐND Việt Nam quy định: Có mấy hình thức báo động?", "options": ["a) 3 hình thức .", "b) 4 hình thức .", "c) 5 hình thức."], "answer": "b) 4 hình thức ."}, {"question": "Câu 11. Điều 79 Mục 8 Chương IV - Điều lệnh QLBĐ QĐND Việt Nam, thời gian tổ chức kiểm tra đơn vị của chỉ huy cấp tiểu đoàn là:", "options": ["a) Tiểu đoàn trưởng, chính trị viên tiểu đoàn và chức vụ tương đương hằng ngày phải trực tiếp kiểm tra đơn vị thuộc quyền", "b) Tiểu đoàn trưởng, chính trị viên tiểu đoàn và chức vụ tương đương ít nhất một tuần phải kiểm tra đơn vị một lần", "c) Tiểu đoàn trưởng, chính trị viên tiểu đoàn và chức vụ tương đương ít nhất một tháng phải kiểm tra đơn vị một lần", "d) Tiểu đoàn trưởng, chính trị viên tiểu đoàn và chức vụ tương đương mỗi quý kiểm tra ít nhất một đại đội trực thuộc"], "answer": "b) Tiểu đoàn trưởng, chính trị viên tiểu đoàn và chức vụ tương đương ít nhất một tuần phải kiểm tra đơn vị một lần"}, {"question": "Câu 12. Điều 108 Mục 5 Chương V - Điều lệnh QLBĐ QĐND Việt Nam, quân số và người phụ trách tổ kiểm soát quân sự không chuyên nghiệp được quy định như thế nào?", "options": ["a) Có từ 2 quân nhân trở lên, do quân nhân chuyên nghiệp phụ trách", "b) Lực lượng kiểm soát quân sự không chuyên nghiệp được tổ chức lâm thời trong khu vực đóng quân và theo sự phân công của chỉ huy khu vực đóng quân. Mỗi tổ kiểm soát quân sự có từ 3 quân nhân trở lên, do sĩ quan hoặc quân nhân chuyên nghiệp phụ trách", "c) Có từ 3 quân nhân trở lên, do hạ sĩ quan có cấp hàm từ trung sĩ trở lên phụ trách", "d) Có từ 4 quân nhân trở lên, bắt buộc phải do sĩ quan cấp đại úy trở lên phụ trách"], "answer": "b) Lực lượng kiểm soát quân sự không chuyên nghiệp được tổ chức lâm thời trong khu vực đóng quân và theo sự phân công của chỉ huy khu vực đóng quân. Mỗi tổ kiểm soát quân sự có từ 3 quân nhân trở lên, do sĩ quan hoặc quân nhân chuyên nghiệp phụ trách"}, {"question": "Câu 13: Điều 118 - Điều lệnh QLBĐ QĐND Việt Nam quy định: Đội canh phòng gồm:", "options": ["a) Lực lượng chuyên nghiệp.", "b) Lực lượng không chuyên nghiệp của đơn vị thay nhau đảm nhiệm.", "c) Cả 2 lực lượng trên."], "answer": "c) Cả 2 lực lượng trên."}, {"question": "Câu 14: Điều 3 - Điều lệnh QLBĐ QĐND Việt Nam quy định:", "options": ["a) Những vấn đề chung nhất về nguyên tắc trong xây dựng và hoạt động của QĐNDVN.", "b) Chức trách, MQH và lễ tiết tác phong quân nhân, quy định các chế độ sinh hoạt, học tập, công tác.", "c) Quy định về tổ chức đóng quân, quản lý quân nhân và quản lý tài sản; quy định về khen thưởng, kỷ luật, khiếu nại, tố cáo.", "d) Cả 3 quy định trên."], "answer": "d) Cả 3 quy định trên."}, {"question": "Câu 15: Điều 6 - Điều lệnh QLBĐ QĐND Việt Nam quy định: Quân nhân trong Quân đội nhân dân Việt Nam là:", "options": ["a)  Công dân nước Việt Nam phục vụ trực tiếp trong Quân đội, được nhân dân giao cho nhiệm vụ bảo vệ Tổ quốc Việt Nam XHCN.", "b) Công dân nước cộng hòa xã hội chủ nghĩa Việt Nam phục vụ trực tiếp trong Quân đội, được nhân dân giao cho nhiệm vụ bảo vệ Tổ quốc Việt Nam XHCN.", "c)  Công dân nước cộng hòa xã hội chủ nghĩa Việt Nam phục vụ trực tiếp trong Quân đội, được nhân dân giao cho nhiệm vụ bảo vệ Tổ quốc."], "answer": "b) Công dân nước cộng hòa xã hội chủ nghĩa Việt Nam phục vụ trực tiếp trong Quân đội, được nhân dân giao cho nhiệm vụ bảo vệ Tổ quốc Việt Nam XHCN."}, {"question": "Câu 16  Điều 46 - Điều lệnh QLBĐ QĐND Việt Nam quy định: Thời gian tập thể dục sáng của quân nhân:", "options": ["a)  30 phút", "b) 20 phút", "c) 15 phút."], "answer": "b) 20 phút"}, {"question": "Câu 17: : Điều 90 - Điều lệnh QLBĐ QĐND Việt Nam quy định: Một trong những nội dung tiếp khách:", "options": ["a) Quân nhân có người nhà, bạn bè đến thăm phải báo cáo người chỉ huy trực tiếp và được đón tiếp ở nơi quy định, không được đưa vào doanh trại.", "b) Quân nhân có người nhà, bạn bè đến thăm phải báo cáo người chỉ huy trực tiếp. Không tiếp người nhà, bạn bè trong giờ làm việc.", "c) Quân nhân có người nhà, bạn bè đến thăm phải báo cáo người chỉ huy trực tiếp và được đón tiếp ở nơi quy định, không được đưa vào doanh trại. Không tiếp người nhà, bạn bè trong giờ làm việc. Trường hợp cần thiết phải được phép của người chỉ huy."], "answer": "c) Quân nhân có người nhà, bạn bè đến thăm phải báo cáo người chỉ huy trực tiếp và được đón tiếp ở nơi quy định, không được đưa vào doanh trại. Không tiếp người nhà, bạn bè trong giờ làm việc. Trường hợp cần thiết phải được phép của người chỉ huy."}, {"question": "Câu 18: Điều 82 - Điều lệnh QLBĐ QĐND Việt Nam quy định: Trong điều kiện bình thường thời bình, người chỉ huy từ cấp nào được quyền cho SQ, QNCN, CN và VCQP ăn nghỉ tại gia đình ngoài doanh trại trong ngày nghỉ, giờ nghỉ:", "options": ["a) Quân khu hoặc tương đương trở lên.", "b) Sư đoàn hoặc tương đương trở lên.", "c) Trung đoàn hoặc tương đương trở lên."], "answer": "c) Trung đoàn hoặc tương đương trở lên."}, {"question": "Câu 19: Nội dung Điều lệnh quản lý bộ đội QĐND Việt Nam 2026 năm 2026 gồm:", "options": ["a) 09 chương, 224 điều và 5 phụ lục.", "b) 09 chương, 225 điều và 5 phụ lục.", "c) 10 chương, 224 điều và 5 phụ lục.", "d) 10 chương, 225 điều và 5 phụ lục."], "answer": "d) 10 chương, 225 điều và 5 phụ lục."}, {"question": "Câu 20: Điều lệnh quản lý bộ đội QĐND Việt Nam  năm 2026 quy định thời gian làm việc từng mùa là:", "options": ["a) Mùa nóng từ 16/4 đến 31/10; mùa lạnh từ 01/11 đến 15/4 năm sau.", "b) Mùa nóng từ 01/4 đến 31/10; mùa lạnh từ 01/11 đến 31/3 năm sau.", "c) Mùa nóng từ 16/4 đến 31/10; mùa lạnh từ 01/11 đến 31/3 năm sau."], "answer": "b) Mùa nóng từ 01/4 đến 31/10; mùa lạnh từ 01/11 đến 31/3 năm sau."}, {"question": "Câu 21: Điều lệnh quản lý bộ đội QĐND Việt Nam năm 2026 quy định thành phần đội canh phòng gồm:", "options": ["a)  Đội trưởng, khi cần có thêm phó đội trưởng; người đốc gác; người gác; người (tổ) tuần tra.", "b) Đội trưởng, khi cần có thêm phó đội trưởng; người (tổ) đốc gác; người gác; người (tổ) tuần tra.", "c) Đội trưởng, khi cần có thêm phó đội trưởng; người (tổ) đốc gác; người gác."], "answer": "a)  Đội trưởng, khi cần có thêm phó đội trưởng; người đốc gác; người gác; người (tổ) tuần tra."}, {"question": "Câu 22: Điều lệnh quản lý bộ đội QĐND Việt Nam năm 2026 quy định  đọc báo, nghe tin, xem truyền hình tập trung tổ chức ở cấp:", "options": ["a) Trung đội và tương đương.", "b) Đại đội và tương đương.", "c) Cả a và b."], "answer": "c) Cả a và b."}, {"question": "Câu 23: Điều lệnh quản lý bộ đội QĐND Việt Nam năm 2026 quy định thời gian bảo quản vũ khí, khí tài, trang bị ngày, tuần:", "options": ["a) Hàng ngày: Vũ khí bộ binh bảo quản 15 phút, vũ khí, trang bị kỹ thuật quân, binh chủng khác bảo quản 30 phút; thời gian bảo quản vào giờ thứ 8; hàng tuần: Vũ khí bộ binh bảo quản 40 phút, vũ khí, trang bị kỹ thuật phức tạp bảo quản ½ ngày; thời gian bảo quản vào ngày làm việc cuối tuần.", "b) Hàng ngày: Vũ khí bộ binh bảo quản 15 phút, vũ khí, trang bị kỹ thuật khác, khí tài phức tạp bảo quản 30 phút vào giờ thứ 8; hàng tuần: Vũ khí bộ binh bảo quản 30 phút, vũ khí, trang bị kỹ thuật khác, khí tài phức tạp bảo quản từ 3 đến 5 giờ vào ngày cuối tuần.", "c) Hàng ngày: Vũ khí bộ binh bảo quản 30 phút, vũ khí, trang bị kỹ thuật khác, khí tài phức tạp bảo quản 45 phút vào giờ thứ 8; hàng tuần: Vũ khí bộ binh bảo quản 40 phút, vũ khí, trang bị kỹ thuật khác, khí tài phức tạp bảo quản từ 3 đến 5 giờ vào ngày làm việc cuối tuần."], "answer": "a) Hàng ngày: Vũ khí bộ binh bảo quản 15 phút, vũ khí, trang bị kỹ thuật quân, binh chủng khác bảo quản 30 phút; thời gian bảo quản vào giờ thứ 8; hàng tuần: Vũ khí bộ binh bảo quản 40 phút, vũ khí, trang bị kỹ thuật phức tạp bảo quản ½ ngày; thời gian bảo quản vào ngày làm việc cuối tuần."}, {"question": "Câu 24: Điều lệnh quản lý bộ đội QĐND Việt Nam năm 2026 quy định về việc nghỉ bù của quân nhân:", "options": ["a) Quân nhân làm việc vào ngày nghỉ thì được nghỉ bù; thời gian và quyền hạn cho quân nhân nghỉ bù do người chỉ huy cấp đại đội và tương đương trở lên quyết định.", "b) Quân nhân làm việc vào ngày nghỉ thì được nghỉ bù; thời gian và quyền hạn cho quân nhân nghỉ bù do người chỉ huy cấp đại đội trở lên quyết định.", "c) Quân nhân làm việc vào ngày nghỉ thì được nghỉ bù; thời gian và quyền hạn cho quân nhân nghỉ bù do người chỉ huy cấp tiểu đoàn và tương đương trở lên quyết định."], "answer": "a) Quân nhân làm việc vào ngày nghỉ thì được nghỉ bù; thời gian và quyền hạn cho quân nhân nghỉ bù do người chỉ huy cấp đại đội và tương đương trở lên quyết định."}, {"question": "Câu 25: Điều lệnh quản lý bộ đội QĐND Việt Nam năm 2026 quy định trang phục quân đội gồm:", "options": ["a) Lễ phục; quân phục thường dùng; quân phục giã chiến; quân phục nghiệp vụ, công tác.", "b) Lễ phục; trang phục thường dùng; trang phục giã chiến; trang phục nghiệp vụ; trang phục công tác.", "c) Quân phục dự lễ; quân phục thường dùng; quân phục giã chiến; quân phục nghiệp vụ; quân phục công tác."], "answer": "b) Lễ phục; trang phục thường dùng; trang phục giã chiến; trang phục nghiệp vụ; trang phục công tác."}, {"question": "Câu 26: Điều lệnh quản lý bộ đội QĐND Việt Nam năm 2026 quy định trực ban nội vụ ở đơn vị gồm:", "options": ["a) 06 chức trách.", "b) 07 chức trách.", "c) 08 chức trách. II. THÔNG TƯ 143 TT/BQP"], "answer": "b) 07 chức trách."}, {"question": "Câu 1: Đ/c cho biết theo thông tư 143/2023/TT-BQP; thứ tự mức độ các hình thức kỷ luật đối với sĩ quan?", "options": ["a) Khiển trách; Cảnh cáo; Hạ bậc lương; Giáng chức; Cách chức; Giáng cấp bậc quân hàm; Tước quân hàm sĩ quan; Tước danh hiệu quân nhân.", "b) Khiển trách; Cảnh cáo; Hạ bậc lương; Giáng cấp bậc quân hàm; Giáng chức; Cách chức; Tước quân hàm sĩ quan; Tước danh hiệu quân nhân.", "c) Khiển trách; Cảnh cáo; Cách chức; Hạ bậc lương; Giáng cấp bậc quân hàm; Giáng chức; Tước quân hàm sĩ quan; Tước danh hiệu quân nhân."], "answer": "a) Khiển trách; Cảnh cáo; Hạ bậc lương; Giáng chức; Cách chức; Giáng cấp bậc quân hàm; Tước quân hàm sĩ quan; Tước danh hiệu quân nhân."}, {"question": "Câu 2: Đ/c cho biết theo Điều 12: thông tư 143/2023/TT-BQP; Đại đội đội trưởng, chính trị viên đại đội, trạm trưởng trạm kiểm soát biên phòng và chức vụ tương đương được quyền?", "options": ["a) Khiển trách đến trung đội trưởng và tương đương; sĩ quan, quân nhân chuyên nghiệp đến cấp đại úy; công chức, công nhân và viên chức quốc phòng có hệ số lương dưới 5,3.", "b) Khiển trách đến trung đội trưởng và tương đương; sĩ quan, quân nhân chuyên nghiệp đến cấp đại úy; công chức, công nhân và viên chức quốc phòng có hệ số lương tương đương cấp Đại úy."], "answer": "a) Khiển trách đến trung đội trưởng và tương đương; sĩ quan, quân nhân chuyên nghiệp đến cấp đại úy; công chức, công nhân và viên chức quốc phòng có hệ số lương dưới 5,3."}, {"question": "Câu 3: Đ/c cho biết theo Điều 15: Thông tư 143/2023/TT-BQP; quy định về chống mệnh lệnh:", "options": ["a) Không chấp hành mệnh lệnh hoặc không thực hiện nhiệm vụ khi người chỉ huy trực tiếp hoặc cấp có thẩm quyền giao thì bị kỷ luật cảnh cáo.", "b) Không chấp hành mệnh lệnh hoặc không thực hiện nhiệm vụ khi người chỉ huy trực tiếp hoặc cấp có thẩm quyền giao mà chưa đến mức bị truy cứu trách nhiệm hình sự thì bị kỷ luật cảnh cáo hoặc hạ bậc lương, giáng cấp bậc quân hàm."], "answer": "b) Không chấp hành mệnh lệnh hoặc không thực hiện nhiệm vụ khi người chỉ huy trực tiếp hoặc cấp có thẩm quyền giao mà chưa đến mức bị truy cứu trách nhiệm hình sự thì bị kỷ luật cảnh cáo hoặc hạ bậc lương, giáng cấp bậc quân hàm."}, {"question": "Câu 4: Đ/c cho biết theo Điều 20: Thông tư 143/2023/TT-BQP quy định: Vắng mặt trái phép, thì bị kỷ luật:", "options": ["a) Người nào vắng mặt trái phép thì bị kỷ luật khiển trách.", "b) Từ cảnh cáo, giáng chức đến cách chức.", "c) Từ khiển trách, cảnh cáo đến hạ bậc lương, giáng cấp bậc quân hàm."], "answer": "a) Người nào vắng mặt trái phép thì bị kỷ luật khiển trách."}, {"question": "Câu 5: Điều 26 - Thông tư 143/2023/TT-BQP quy định: Vi phạm các quy định về trực chiến, trực chỉ huy, trực ban, trực nghiệp vụ?", "options": ["a) Tự ý bỏ vị trí hoặc không hoàn thành nhiệm vụ được giao thì bị kỷ luật khiển trách hoặc cảnh cáo.", "b) Tự ý bỏ vị trí hoặc không hoàn thành nhiệm vụ được giao thì bị kỷ luật khiển trách.", "c) Tự ý bỏ vị trí hoặc không hoàn thành nhiệm vụ được giao thì bị kỷ luật cảnh cáo."], "answer": "a) Tự ý bỏ vị trí hoặc không hoàn thành nhiệm vụ được giao thì bị kỷ luật khiển trách hoặc cảnh cáo."}, {"question": "Câu 6: Điều 35 - Thông tư 143/2023/TT-BQP quy định: Chiếm đoạt tài sản?", "options": ["a) Lợi dụng chức vụ, quyền hạn hoặc dùng các thủ đoạn khác để chiếm đoạt tài sản của Nhà nước, tổ chức, công dân có giá trị dưới 2.000.000 (hai triệu) đồng thì bị kỷ luật từ khiển trách, cảnh cáo đến hạ bậc lương.", "b) Lợi dụng chức vụ, quyền hạn hoặc dùng các thủ đoạn khác để chiếm đoạt tài sản của Nhà nước, tổ chức, công dân có giá trị dưới 2.000.000 (hai triệu) đồng thì bị kỷ luật khiển trách.", "c) Lợi dụng chức vụ, quyền hạn hoặc dùng các thủ đoạn khác để chiếm đoạt tài sản của Nhà nước, tổ chức, công dân có giá trị dưới 2.000.000 (hai triệu) đồng thì bị kỷ luật từ cảnh cáo đến hạ bậc lương."], "answer": "a) Lợi dụng chức vụ, quyền hạn hoặc dùng các thủ đoạn khác để chiếm đoạt tài sản của Nhà nước, tổ chức, công dân có giá trị dưới 2.000.000 (hai triệu) đồng thì bị kỷ luật từ khiển trách, cảnh cáo đến hạ bậc lương."}, {"question": "Câu 7: Điều 40 - Thông tư 143/2023/TT-BQP quy định: Vi phạm liên quan đến ma túy?", "options": ["a) Người có các hành vi vi phạm liên quan đến ma túy như: Tàng trữ, mua bán, vận chuyển, tổ chức sử dụng, sử dụng trái phép chất ma túy thì bị kỷ luật tước danh hiệu quân nhân, buộc thôi việc.", "b) Sử dụng trái phép các chất ma túy thì bị kỷ luật tước danh hiệu quân nhân, buộc thôi việc.", "c) Sử dụng trái phép các chất ma túy thì bị kỷ luật cách chức hoặc giáng cấp bậc quân hàm."], "answer": "a) Người có các hành vi vi phạm liên quan đến ma túy như: Tàng trữ, mua bán, vận chuyển, tổ chức sử dụng, sử dụng trái phép chất ma túy thì bị kỷ luật tước danh hiệu quân nhân, buộc thôi việc."}, {"question": "Câu 8: Điều 42 - Thông tư 143/2023/TT-BQP quy định: Đánh bạc, tổ chức đánh bạc, gá bạc; cho vay nặng lãi?", "options": ["a) Đánh bạc, tổ chức đánh bạc, gá bạc trái phép; cho vay nặng lãi dưới bất kỳ hình thức nào, thì bị kỷ luật khiển trách hoặc cảnh cáo.", "b) Đánh bạc, tổ chức đánh bạc, gá bạc trái phép; cho vay nặng lãi dưới bất kỳ hình thức nào, thì bị kỷ luật khiển trách.", "c) Đánh bạc, tổ chức đánh bạc, gá bạc trái phép; cho vay nặng lãi dưới bất kỳ hình thức nào, thì bị kỷ luật cảnh cáo."], "answer": "a) Đánh bạc, tổ chức đánh bạc, gá bạc trái phép; cho vay nặng lãi dưới bất kỳ hình thức nào, thì bị kỷ luật khiển trách hoặc cảnh cáo."}, {"question": "Câu 9: Mục 1, Điều 41 - Thông tư 143/2023/TT-BQP quy định: Quản lý, sử dụng trang bị, hạ tầng công nghệ thông tin sai quy định để xảy ra mất mát, hư hỏng hoặc làm các hệ thống thông tin của cơ quan, đơn vị không hoạt động, mất an toàn thông tin, an ninh mạng thì bị kỷ luật?", "options": ["a) Khiển trách, cảnh cáo, hạ bậc lương đến giáng chức, cách chức.", "b) Khiển trách; cảnh cáo; giáng chức; cách chức; hạ bậc lương; giáng cấp bậc quân hàm; tước quân hàm sĩ quan; tước danh hiệu quân nhân.", "c) Khiển trách; cảnh cáo; hạ bậc lương; giáng chức; giáng cấp bậc quân hàm; cách chức; tước quân hàm sĩ quan; tước danh hiệu quân nhân."], "answer": "a) Khiển trách, cảnh cáo, hạ bậc lương đến giáng chức, cách chức."}, {"question": "Câu 10: Mục 1, Điều 41 - Thông tư 143/2023/TT-BQP quy định: Sử dụng các trang thiết bị công nghệ thông tin, thiết bị di động thông minh có truy cập vào Internet để tạo lập, xử lý, lưu trữ hoặc cung cấp, trao đổi các tài liệu quân sự có nội dung chưa được phép phổ biến trên mạng Intemet và các phương tiện thông tin đại chúng; thông tin kích động bạo lực, đồi trụy, mê tín dị đoan;", "options": ["a) Khiển trách, cảnh cáo, hạ bậc lương đến giáng chức, cách chức.", "b) Khiển trách; cảnh cáo; giáng chức; cách chức; hạ bậc lương; giáng cấp bậc quân hàm; tước quân hàm sĩ quan; tước danh hiệu quân nhân.", "c) Khiển trách; cảnh cáo; hạ bậc lương; giáng chức; giáng cấp bậc quân hàm; cách chức; tước quân hàm sĩ quan; tước danh hiệu quân nhân."], "answer": "a) Khiển trách, cảnh cáo, hạ bậc lương đến giáng chức, cách chức."}, {"question": "Câu 11: Mục 2, Điều 41 - Thông tư 143/2023/TT-BQP quy định: Sử dụng các trang thông tin điện tử, các mạng xã hội để thực hiện hành vi đăng tải, phát tán, bình luận, chia sẻ những thông tin trái quan điểm, đường lối của Đảng, chính sách pháp luật của Nhà nước; thông tin liên quan đến bí mật Nhà nước, bí mật quân sự; tin có nội dung xuyên tạc, bịa đặt, xúc phạm danh dự cá nhân, uy tín tổ chức làm ảnh hưởng xấu đến hình ảnh quân nhân, đơn vị; tham gia các diễn đàn, nhóm liên quan đến tội phạm, tổ chức phản động, chống đối chính trị thì bị kỷ luật?", "options": ["a) Từ giáng cấp bậc quân hàm đến tước danh hiệu quân nhân, buộc thôi việc.", "b) Khiển trách; cảnh cáo; giáng chức; cách chức; hạ bậc lương; giáng cấp bậc quân hàm; tước quân hàm sĩ quan; tước danh hiệu quân nhân.", "c) Khiển trách; cảnh cáo; hạ bậc lương; giáng chức; giáng cấp bậc quân hàm; cách chức; tước quân hàm sĩ quan; tước danh hiệu quân nhân."], "answer": "a) Từ giáng cấp bậc quân hàm đến tước danh hiệu quân nhân, buộc thôi việc."}, {"question": "Câu 12: Điều 47 - Thông tư 143/2023/TT-BQP quy định:Trình tự, thủ tục chung trong xử lý kỷ luật?", "options": ["a) Tổ chức sinh hoạt (họp) kiểm điểm (1); Xác minh, kết luận về hành vi vi phạm kỷ luật (2); Báo cáo cấp ủy (chi bộ) đảng có thẩm quyền xem xét, thông qua (3); Ra quyết định kỷ luật hoặc đề nghị cấp có thẩm quyền ra quyết định theo quyền hạn phân cấp (4); Công bố quyết định kỷ luật, báo cáo lên trên và lưu trữ hồ sơ ở đơn vị (5).", "b) Người vi phạm phải tự kiểm điểm bằng văn bản, trước tập thể cơ quan, đơn vị và tự nhận hình thức kỷ luật (1); Xác minh, kết luận về hành vi vi phạm kỷ luật (2); Báo cáo cấp ủy (chi bộ) đảng có thẩm quyền xem xét, thông qua (3); Ra quyết định kỷ luật hoặc đề nghị cấp có thẩm quyền ra quyết định theo quyền hạn phân cấp (4); Công bố quyết định kỷ luật, báo cáo lên trên và lưu trữ hồ sơ ở đơn vị (5).", "c) Người vi phạm phải tự kiểm điểm bằng văn bản, trước tập thể cơ quan, đơn vị và tự nhận hình thức kỷ luật (1); Tập thể cơ quan, đơn vị đoáng góp ý kiến (2); Kiểm tra, xác minh (3); kết luận về hành vi vi phạm kỷ luật (4); Báo cáo cấp ủy (chi bộ) đảng có thẩm quyền xem xét, thông qua (5); Ra quyết định kỷ luật hoặc đề nghị cấp có thẩm quyền ra quyết định theo quyền hạn phân cấp (6); Công bố quyết định kỷ luật, báo cáo lên trên và lưu trữ hồ sơ ở đơn vị (7)."], "answer": "a) Tổ chức sinh hoạt (họp) kiểm điểm (1); Xác minh, kết luận về hành vi vi phạm kỷ luật (2); Báo cáo cấp ủy (chi bộ) đảng có thẩm quyền xem xét, thông qua (3); Ra quyết định kỷ luật hoặc đề nghị cấp có thẩm quyền ra quyết định theo quyền hạn phân cấp (4); Công bố quyết định kỷ luật, báo cáo lên trên và lưu trữ hồ sơ ở đơn vị (5)."}, {"question": "Câu 13: Đ/c cho biết theo thông tư 143/2023/TT-BQP; thứ tự mức độ các hình thức kỷ luật đối với sĩ quan?", "options": ["a) Khiển trách; Cảnh cáo; Cách chức; Hạ bậc lương; Giáng cấp bậc quân hàm; Giáng chức; Tước quân hàm sĩ quan; Tước danh hiệu quân nhân.b) Khiển trách; Cảnh cáo; Hạ bậc lương; Giáng cấp bậc quân hàm; Giáng chức; Cách chức; Tước quân hàm sĩ quan; Tước danh hiệu quân nhân.", "c) Khiển trách; Cảnh cáo; Hạ bậc lương; Giáng chức; Cách chức; Giáng cấp bậc quân hàm; Tước quân hàm sĩ quan; Tước danh hiệu quân nhân."], "answer": "c) Khiển trách; Cảnh cáo; Hạ bậc lương; Giáng chức; Cách chức; Giáng cấp bậc quân hàm; Tước quân hàm sĩ quan; Tước danh hiệu quân nhân."}, {"question": "Câu 14: Đ/c cho biết theo Điều 12: thông tư 143/2023/TT-BQP; Đại đội đội trưởng, chính trị viên đại đội, trạm trưởng trạm kiểm soát biên phòng và chức vụ tương đương được quyền?", "options": ["a) Khiển trách đến trung đội trưởng và tương đương; sĩ quan, quân nhân chuyên nghiệp đến cấp đại úy; công chức, công nhân và viên chức quốc phòng có hệ số lương dưới 6,0.", "b) Khiển trách đến trung đội trưởng và tương đương; sĩ quan, quân nhân chuyên nghiệp đến cấp đại úy; công chức, công nhân và viên chức quốc phòng có hệ số lương tương đương cấp Đại úy.", "c) Khiển trách đến trung đội trưởng và tương đương; sĩ quan, quân nhân chuyên nghiệp đến cấp đại úy; công chức, công nhân và viên chức quốc phòng có hệ số lương dưới 5,3. III. CHỈ THỊ 103"], "answer": "c) Khiển trách đến trung đội trưởng và tương đương; sĩ quan, quân nhân chuyên nghiệp đến cấp đại úy; công chức, công nhân và viên chức quốc phòng có hệ số lương dưới 5,3."}, {"question": "Câu 1: Đ/c cho biết nội dung và thời gian ban hành Chỉ thị 103/CT-BQP của Bộ trưởng Bộ Quốc phòng?", "options": ["a) Chỉ thị về việc tiếp tục tăng cường quản lý, giáo dục chấp hành kỷ luật và bảo đảm an toàn trong Quân đội nhân dân Việt Nam, ban hành ngày 28/11/2020.", "b) Chỉ thị về việc tiếp tục tăng cường quản lý, giáo dục chấp hành kỷ luật và bảo đảm an toàn trong Quân đội nhân dân Việt Nam, ban hành ngày 28/11/2019.", "c) Chỉ thị về việc tiếp tục tăng cường quản lý và bảo đảm an toàn trong Quân đội nhân dân Việt Nam, ban hành ngày 28/11/2019.", "d) Chỉ thị về việc tiếp tục tăng cường quản lý và giáo dục chấp hành kỷ luật trong Quân đội nhân dân Việt Nam, ban hành ngày 28/11/2019."], "answer": "d) Chỉ thị về việc tiếp tục tăng cường quản lý và giáo dục chấp hành kỷ luật trong Quân đội nhân dân Việt Nam, ban hành ngày 28/11/2019."}, {"question": "Câu 2: Đ/c cho biết Chỉ thị 103/CT-BQP của Bộ trưởng Bộ Quốc phòng gồm bao nhiêu Bộ Quốc phòng; ra nghị quyết chuyên đề về tăng cường công tác giáo dục chính trị, quản lý tư tưởng, duy trì kỷ luật và bảo đảm an toàn. Trong đó chú trọng đề ra mục tiêu và các giải pháp thực hiện cụ thể, sát với quy mô đóng quân, biên chế đơn vị và đối tượng quản lý; chỉ đạo thực hiện đồng bộ, kịp thời", "c) Các cấp ủy, chi bộ tập trung lãnh đạo, chỉ đạo quán triệt, cụ thể hóa, triển khai thực hiện nghiêm túc, triệt để các nghị quyết, chỉ thị, kết luận của Đảng, Nhà nước, Quân ủy Trung ương, Bộ Quốc phòng; ra nghị quyết chuyên đề về tăng cường công tác giáo dục chính trị, quản lý tư tưởng, duy trì kỷ luật và bảo đảm an toàn. Trong đó chú trọng đề ra mục tiêu và các giải pháp thực hiện cụ thể, sát với loại hình, nhiệm vụ đơn vị và đối tượng quản lý; chỉ đạo thực hiện quyết liệt, thực chất", "d) Các cấp ủy, chỉ huy các cấp tập trung chỉ đạo quán triệt, cụ thể hóa, triển khai thực hiện nghiêm túc, triệt để các nghị quyết, chỉ thị, kết luận của Đảng, Nhà nước, Quân ủy Trung ương, Bộ Quốc phòng; ra chỉ thị chuyên đề về tăng cường công tác giáo dục chính trị, quản lý tư tưởng, duy trì kỷ luật và bảo đảm an toàn. Trong đó chú trọng đề ra mục tiêu và các biện pháp thực hiện sát với tình hình đơn vị; chỉ đạo thực hiện quyết liệt, thực chất"], "answer": "c) Các cấp ủy, chi bộ tập trung lãnh đạo, chỉ đạo quán triệt, cụ thể hóa, triển khai thực hiện nghiêm túc, triệt để các nghị quyết, chỉ thị, kết luận của Đảng, Nhà nước, Quân ủy Trung ương, Bộ Quốc phòng; ra nghị quyết chuyên đề về tăng cường công tác giáo dục chính trị, quản lý tư tưởng, duy trì kỷ luật và bảo đảm an toàn. Trong đó chú trọng đề ra mục tiêu và các giải pháp thực hiện cụ thể, sát với loại hình, nhiệm vụ đơn vị và đối tượng quản lý; chỉ đạo thực hiện quyết liệt, thực chất"}, {"question": "Câu 2. Theo Chỉ thị số 76/CT-BQP ngày 28/4/2026 của Bộ trưởng Bộ Quốc phòng, tại nội dung thứ hai, các cụm từ chỉ tiêu, phương châm và đối tượng chuyển biến trọng tâm được xác định chính xác là:", "options": ["a) Toàn quân tổ chức đợt sinh hoạt chính trị, đợt “chỉnh huấn” sâu rộng; tăng cường giáo dục chuẩn mực đạo đức cách mạng của cán bộ, đảng viên và chuẩn mực “Bộ đội Cụ Hồ” thời kỳ mới; tuyên truyền, phổ biến, giáo dục pháp luật Nhà nước, điều lệnh, điều lệ Quân đội, quy định của đơn vị; quán triệt sâu sắc tinh thần “7 dám”, nội dung “2 kiên định, 2 đẩy mạnh, 2 ngăn ngừa” và phương châm “5 vững”, “6 rõ”, làm cho cán bộ, chiến sĩ toàn quân, trước hết là cán bộ cấp phân đội và cán bộ trực tiếp quản lý chuyển biến tích cực, mạnh mẽ về nhận thức, trách nhiệm", "b) Toàn quân tổ chức đợt sinh hoạt chính trị, đợt “chỉnh huấn” sâu rộng; tăng cường giáo dục chuẩn mực đạo đức cách mạng của cán bộ, đảng viên và chuẩn mực “Bộ đội Cụ Hồ” thời kỳ mới; tuyên truyền, phổ biến, giáo dục pháp luật Nhà nước, điều lệnh, điều lệ Quân đội, quy định của đơn vị; quán triệt sâu sắc tinh thần “7 dám”, nội dung “2 kiên định, 2 đẩy mạnh, 2 ngăn ngừa” và phương châm “5 vững”, “6 rõ”, làm cho cán bộ, chiến sĩ toàn quân, trước hết là cán bộ chủ trì, chủ chốt các cấp chuyển biến tích cực, mạnh mẽ về nhận thức, trách nhiệm", "c) Toàn quân tổ chức đợt sinh hoạt chính trị, đợt “chỉnh quân” sâu rộng; tăng cường giáo dục chuẩn mực đạo đức cách mạng của cán bộ, đảng viên và phẩm chất “Bộ đội Cụ Hồ” thời kỳ mới; tuyên truyền, phổ biến, giáo dục pháp luật Nhà nước, điều lệnh, điều lệ Quân đội, quy định của đơn vị; quán triệt sâu sắc tinh thần “7 dám”, nội dung “3 kiên định, 2 đẩy mạnh, 2 phòng ngừa” và phương châm “6 vững”, “5 rõ”, làm cho cán bộ, chiến sĩ toàn quân, trước hết là cán bộ chủ trì, chủ chốt các cấp chuyển biến tích cực, mạnh mẽ về nhận thức, trách nhiệm", "d) Toàn quân tổ chức đợt sinh hoạt chính trị, đợt “chỉnh huấn” sâu rộng; tăng cường giáo dục chuẩn mực đạo đức cách mạng của cán bộ, đảng viên và chuẩn mực “Bộ đội Cụ Hồ” thời kỳ mới; tuyên truyền, phổ biến, giáo dục pháp luật Nhà nước, điều lệnh, điều lệ Quân đội, quy định của đơn vị; quán triệt sâu sắc tinh thần “6 dám”, nội dung “2 kiên định, 3 đẩy mạnh, 2 ngăn ngừa” và phương châm “5 vững”, “6 rõ”, làm cho cán bộ, chiến sĩ toàn quân, trước hết là lực lượng hạ sĩ quan - binh sĩ chuyển biến tích cực, mạnh mẽ về nhận thức, trách nhiệm"], "answer": "b) Toàn quân tổ chức đợt sinh hoạt chính trị, đợt “chỉnh huấn” sâu rộng; tăng cường giáo dục chuẩn mực đạo đức cách mạng của cán bộ, đảng viên và chuẩn mực “Bộ đội Cụ Hồ” thời kỳ mới; tuyên truyền, phổ biến, giáo dục pháp luật Nhà nước, điều lệnh, điều lệ Quân đội, quy định của đơn vị; quán triệt sâu sắc tinh thần “7 dám”, nội dung “2 kiên định, 2 đẩy mạnh, 2 ngăn ngừa” và phương châm “5 vững”, “6 rõ”, làm cho cán bộ, chiến sĩ toàn quân, trước hết là cán bộ chủ trì, chủ chốt các cấp chuyển biến tích cực, mạnh mẽ về nhận thức, trách nhiệm"}, {"question": "Câu 3. Theo Chỉ thị số 76/CT-BQP ngày 28/4/2026 của Bộ trưởng Bộ Quốc phòng, nội dung thứ ba quy định cụ thể về chủ thể và mức độ chịu trách nhiệm đối với chất lượng công tác giáo dục chính trị, tư tưởng, kỷ luật, an toàn như thế nào?", "options": ["a) Cấp ủy, người chỉ huy, chính ủy, chính trị viên các cấp cùng chịu trách nhiệm liên đới về chất lượng công tác giáo dục chính trị, quản lý tư tưởng, duy trì kỷ luật và bảo đảm an toàn của cơ quan, đơn vị", "b) Người chỉ huy, chính ủy, chính trị viên các cấp chịu trách nhiệm trực tiếp trước Thường vụ Đảng ủy đơn vị về kết quả công tác tư tưởng, kỷ luật và an toàn của cơ quan, đơn vị", "c) Người chỉ huy, chính ủy, chính trị viên các cấp chịu trách nhiệm chính về chất lượng công tác giáo dục chính trị, quản lý tư tưởng, duy trì kỷ luật và bảo đảm an toàn của cơ quan, đơn vị", "d) Cán bộ chủ trì và các cơ quan chức năng (Tham mưu, Chính trị, Hậu cần - Kỹ thuật) chịu trách nhiệm toàn diện về công tác giáo dục chính trị, quản lý tư tưởng, duy trì kỷ luật và bảo đảm an toàn của cơ quan, đơn vị"], "answer": "c) Người chỉ huy, chính ủy, chính trị viên các cấp chịu trách nhiệm chính về chất lượng công tác giáo dục chính trị, quản lý tư tưởng, duy trì kỷ luật và bảo đảm an toàn của cơ quan, đơn vị"}, {"question": "Câu 4. Theo Chỉ thị số 76/CT-BQP ngày 28/4/2026 của Bộ trưởng Bộ Quốc phòng, tại nội dung thứ tư và thứ năm, quy định về công tác cán bộ, bảo vệ an ninh và phối hợp quản lý quân nhân nêu chuẩn xác nội dung nào?", "options": ["a) Thực hiện tốt việc tuyển công dân nhập ngũ, tuyển dụng, tuyển chọn, quy hoạch, đào tạo, bồi dưỡng, bố trí, sử dụng cán bộ theo phân cấp, không để xảy ra tiêu cực ảnh hưởng đến chất lượng đầu vào của cơ quan, đơn vị. Thực hiện nghiêm các quy định về bảo vệ chính trị nội bộ, bảo vệ bí mật nhà nước, bảo đảm an ninh, an toàn. Phối hợp chặt chẽ giữa đơn vị với cấp ủy, chính quyền địa phương, các đoàn thể và công an khu vực trong công tác quản lý tư tưởng quân nhân", "b) Thực hiện tốt việc tuyển quân, tuyển dụng, quy hoạch, bổ nhiệm, đào tạo, bồi dưỡng cán bộ theo biên chế, kiên quyết xử lý sai phạm ảnh hưởng đến chất lượng chính trị của cơ quan, đơn vị. Thực hiện nghiêm các quy định về bảo vệ an ninh nội bộ, bảo vệ bí mật quân sự. Phối hợp chặt chẽ giữa đơn vị với các tổ chức chính trị - xã hội và gia đình quân nhân trong công tác quản lý", "c) Thực hiện tốt việc tuyển công dân nhập ngũ, tuyển dụng, tuyển chọn, quy hoạch, đào tạo, bồi dưỡng, bố trí, sử dụng cán bộ theo phân cấp, không để xảy ra tiêu cực ảnh hưởng đến chất lượng đầu vào của cơ quan, đơn vị. Thực hiện nghiêm các quy định về bảo vệ chính trị nội bộ, bảo vệ bí mật nhà nước, bảo đảm an ninh, an toàn. Phối hợp chặt chẽ giữa đơn vị với cấp ủy, chính quyền địa phương, gia đình và các cơ quan chức năng trong công tác quản lý quân nhân", "d) Thực hiện tốt việc tuyển chọn công dân nhập ngũ, tuyển dụng nhân sự, đào tạo, bố trí sử dụng cán bộ đúng quy trình, không để xảy ra tham nhũng làm giảm sút chất lượng đầu vào. Thực hiện nghiêm quy chế bảo mật thông tin và bảo vệ an toàn doanh trại; phối hợp chặt chẽ giữa chỉ huy phân đội với gia đình quân nhân"], "answer": "c) Thực hiện tốt việc tuyển công dân nhập ngũ, tuyển dụng, tuyển chọn, quy hoạch, đào tạo, bồi dưỡng, bố trí, sử dụng cán bộ theo phân cấp, không để xảy ra tiêu cực ảnh hưởng đến chất lượng đầu vào của cơ quan, đơn vị. Thực hiện nghiêm các quy định về bảo vệ chính trị nội bộ, bảo vệ bí mật nhà nước, bảo đảm an ninh, an toàn. Phối hợp chặt chẽ giữa đơn vị với cấp ủy, chính quyền địa phương, gia đình và các cơ quan chức năng trong công tác quản lý quân nhân"}, {"question": "Câu 5. Theo Chỉ thị số 76/CT-BQP ngày 28/4/2026 của Bộ trưởng Bộ Quốc phòng, tại nội dung thứ bảy, yêu cầu đổi mới và kết hợp trong công tác giáo dục, đào tạo tại các học viện, nhà trường Quân đội được quy định là:", "options": ["a) Các học viện, nhà trường Quân đội rà soát, đổi mới nội dung, chương trình, nâng cao chất lượng giáo dục, đào tạo; kết hợp chặt chẽ giữa nâng cao chất lượng chuyên môn, chuyên ngành đào tạo gắn với rèn luyện thể lực, phương pháp tác chiến hiện đại, bảo đảm cán bộ khi ra trường có đủ bản lĩnh chính trị và năng lực chỉ huy chiến đấu ngoài thực địa", "b) Các học viện, nhà trường Quân đội rà soát, đổi mới nội dung, chương trình, nâng cao chất lượng giáo dục, đào tạo; kết hợp chặt chẽ giữa nâng cao chất lượng chuyên môn, chuyên ngành đào tạo gắn với nâng cao trình độ nhận thức về pháp luật Nhà nước, kỷ luật quân đội, rèn luyện bản lĩnh, kỹ năng, phương pháp, tác phong chỉ huy, quản lý, bảo đảm cán bộ khi ra trường có đủ bản lĩnh, trình độ, năng lực chỉ huy, quản lý đơn vị", "c) Các học viện, nhà trường Quân đội rà soát, cập nhật giáo trình, tăng cường thời lượng thực hành diễn tập; kết hợp chặt chẽ giữa đào tạo lý luận với chấp hành điều lệnh quản lý bộ đội, rèn luyện phương pháp, tác phong chỉ huy khoa học, bảo đảm học viên tốt nghiệp nắm chắc chức trách, nhiệm vụ của người cán bộ cơ sở", "d) Các học viện, nhà trường Quân đội rà soát, đổi mới nội dung, chương trình, nâng cao chất lượng giáo dục, đào tạo; kết hợp chặt chẽ giữa nâng cao chất lượng chuyên môn, chuyên ngành đào tạo gắn với bồi dưỡng lý luận chính trị, năng lực quản lý hành chính quân sự, rèn luyện tác phong sâu sát, bảo đảm cán bộ khi ra trường có đủ phẩm chất đạo đức và năng lực lãnh đạo đơn vị CHỈ THỊ 123"], "answer": "b) Các học viện, nhà trường Quân đội rà soát, đổi mới nội dung, chương trình, nâng cao chất lượng giáo dục, đào tạo; kết hợp chặt chẽ giữa nâng cao chất lượng chuyên môn, chuyên ngành đào tạo gắn với nâng cao trình độ nhận thức về pháp luật Nhà nước, kỷ luật quân đội, rèn luyện bản lĩnh, kỹ năng, phương pháp, tác phong chỉ huy, quản lý, bảo đảm cán bộ khi ra trường có đủ bản lĩnh, trình độ, năng lực chỉ huy, quản lý đơn vị"}, {"question": "Câu 1. Theo Chỉ thị số 123/CT-QK ngày 13/01/2026 của Tư lệnh Quân khu 4 về việc bảo đảm an toàn trong thực hiện nhiệm vụ năm 2026, gồm có bao nhiêu nội dung?", "options": ["a) Gồm 6 nội dung", "b) Gồm 7 nội dung", "c) Gồm 8 nội dung", "d) Gồm 9 nội dung"], "answer": "c) Gồm 8 nội dung"}, {"question": "Câu 2. Theo Chỉ thị số 123/CT-QK ngày 13/01/2026 của Tư lệnh Quân khu 4, nội dung thứ 1 của chỉ thị là gì?", "options": ["a) Duy trì chặt chẽ chế độ trong ngày, trong tuần, tuyệt đối không được xả hơi, chủ quan", "b) Cấp ủy, chỉ huy các cấp tăng cường lãnh đạo, chỉ đạo, tập trung quán triệt nghiêm túc các chỉ thị, nghị quyết, hướng dẫn ở các cấp; từng cán bộ, chiến sỹ phải nắm chắc mục tiêu, chỉ tiêu, nhiệm vụ trọng tâm, đột phá trong năm 2026 và có bản đăng ký bảo đảm an toàn và hoàn thành tốt các nhiệm vụ được giao", "c) Khi cán bộ, chiến sỹ đi công tác, đi phép, thực hiện nhiệm vụ ngoài đơn vị phải tổ chức quán triệt, giao nhiệm vụ cụ thể", "d) Cán bộ các cấp phải gần gũi, sâu sát, là chỗ dựa tinh thần cho chiến sỹ; nghiêm cấm việc quân phiệt bằng lời nói và hành động"], "answer": "b) Cấp ủy, chỉ huy các cấp tăng cường lãnh đạo, chỉ đạo, tập trung quán triệt nghiêm túc các chỉ thị, nghị quyết, hướng dẫn ở các cấp; từng cán bộ, chiến sỹ phải nắm chắc mục tiêu, chỉ tiêu, nhiệm vụ trọng tâm, đột phá trong năm 2026 và có bản đăng ký bảo đảm an toàn và hoàn thành tốt các nhiệm vụ được giao"}, {"question": "Câu 3. Theo Chỉ thị số 123/CT-QK ngày 13/01/2026 của Tư lệnh Quân khu 4, nội dung thứ 2 của chỉ thị quy định về vấn đề gì?", "options": ["a) Duy trì chặt chẽ chế độ trong ngày, trong tuần, tuyệt đối không được xả hơi, chủ quan, đặc biệt là lực lượng Ban CHQS cấp xã, phải cử cán bộ có trình độ, năng lực, trách nhiệm, gương mẫu, tự giác. Các đơn vị nhỏ lẻ, xa sự chỉ huy của cơ quan, đơn vị phải tăng cường kiểm tra đột xuất, ngăn ngừa vi phạm. Quản lý chặt chẽ tình hình tư tưởng, mối quan hệ của cán bộ, chiến sỹ cấp dưới, nghiêm cấm vay mượn tiền quá khả năng chi trả, cán bộ đánh bài, chơi game dưới mọi hình thức; Kịp thời phát hiện những cán bộ có tư tưởng tiêu cực, nợ nần không có khả năng chi trả, chủ động ngăn ngừa, không để vi phạm kỷ luật xảy ra", "b) Khi cán bộ, chiến sỹ đi công tác, đi phép, thực hiện nhiệm vụ ngoài đơn vị, phải tổ chức quán triệt, giao nhiệm vụ cụ thể; kiểm tra các phương tiện vận chuyển, bảo đảm an toàn tuyệt đối thì mới thực hiện nhiệm vụ", "c) Cán bộ các cấp phải gần gũi, sâu sát, là chỗ dựa tinh thần cho chiến sỹ; đặc biệt, cán bộ Trung đội, Đại đội, phải hiểu rõ điều kiện hoàn cảnh gia đình của từng chiến sỹ", "d) Trong thực hiện nhiệm vụ Huấn luyện: cán bộ trực tiếp huấn luyện, giảng dạy khi lên lớp không được sử dụng điện thoại; phải huấn luyện thành thạo động tác"], "answer": "a) Duy trì chặt chẽ chế độ trong ngày, trong tuần, tuyệt đối không được xả hơi, chủ quan, đặc biệt là lực lượng Ban CHQS cấp xã, phải cử cán bộ có trình độ, năng lực, trách nhiệm, gương mẫu, tự giác. Các đơn vị nhỏ lẻ, xa sự chỉ huy của cơ quan, đơn vị phải tăng cường kiểm tra đột xuất, ngăn ngừa vi phạm. Quản lý chặt chẽ tình hình tư tưởng, mối quan hệ của cán bộ, chiến sỹ cấp dưới, nghiêm cấm vay mượn tiền quá khả năng chi trả, cán bộ đánh bài, chơi game dưới mọi hình thức; Kịp thời phát hiện những cán bộ có tư tưởng tiêu cực, nợ nần không có khả năng chi trả, chủ động ngăn ngừa, không để vi phạm kỷ luật xảy ra"}, {"question": "Câu 4. Theo Chỉ thị số 123/CT-QK ngày 13/01/2026 của Tư lệnh Quân khu 4, nội dung thứ 3 của chỉ thị quy định về nội dung gì?", "options": ["a) Về công tác tăng gia sản xuất và chăm lo đời sống bữa ăn cho bộ đội", "b) Khi cán bộ, chiến sỹ đi công tác, đi phép, thực hiện nhiệm vụ ngoài đơn vị, phải tổ chức quán triệt, giao nhiệm vụ cụ thể; kiểm tra các phương tiện vận chuyển, bảo đảm an toàn tuyệt đối thì mới thực hiện nhiệm vụ", "c) Về củng cố cảnh quan môi trường chính quy, xanh, sạch, đẹp", "d) Về quản lý vũ khí trang bị, đạn dược và tủ súng của đơn vị"], "answer": "b) Khi cán bộ, chiến sỹ đi công tác, đi phép, thực hiện nhiệm vụ ngoài đơn vị, phải tổ chức quán triệt, giao nhiệm vụ cụ thể; kiểm tra các phương tiện vận chuyển, bảo đảm an toàn tuyệt đối thì mới thực hiện nhiệm vụ"}, {"question": "Câu 5. Theo Chỉ thị số 123/CT-QK ngày 13/01/2026 của Tư lệnh Quân khu 4, nội dung thứ 4 của chỉ thị quy định về:", "options": ["a) Cán bộ các cấp phải gần gũi, sâu sát, là chỗ dựa tinh thần cho chiến sỹ; đặc biệt, cán bộ Trung đội, Đại đội, phải hiểu rõ điều kiện hoàn cảnh gia đình của từng chiến sỹ, nhất là đối với chiến sỹ mới. Nghiêm cấm việc quân phiệt bằng lời nói và hành động; tuyệt đối không được thu tiền của bộ đội sai mục đích", "b) Trong thực hiện nhiệm vụ Huấn luyện: cán bộ trực tiếp huấn luyện, giảng dạy khi lên lớp không được sử dụng điện thoại", "c) Phải thường xuyên củng cố cảnh quan, xây dựng môi trường chính quy, xanh, sạch, đẹp", "d) Quản lý chặt chẽ hệ thống kho tàng, vũ khí trang bị, đạn, tủ súng không để hư hỏng, mất mát"], "answer": "a) Cán bộ các cấp phải gần gũi, sâu sát, là chỗ dựa tinh thần cho chiến sỹ; đặc biệt, cán bộ Trung đội, Đại đội, phải hiểu rõ điều kiện hoàn cảnh gia đình của từng chiến sỹ, nhất là đối với chiến sỹ mới. Nghiêm cấm việc quân phiệt bằng lời nói và hành động; tuyệt đối không được thu tiền của bộ đội sai mục đích"}, {"question": "Câu 6. Theo Chỉ thị số 123/CT-QK ngày 13/01/2026 của Tư lệnh Quân khu 4, nội dung thứ 5 của chỉ thị là gì?", "options": ["a) Củng cố cảnh quan, trồng cây xanh có tính chất lâu dài, đồng bộ từng khu vực", "b) Trong thực hiện nhiệm vụ Huấn luyện: cán bộ trực tiếp huấn luyện, giảng dạy khi lên lớp không được sử dụng điện thoại; phải huấn luyện thành thạo động tác, nắm vững tính năng, kỹ chiến thuật khi sử dụng các loại vũ khí, trang bị. Khi sử dụng thuốc nổ, phải giám sát chặt chẽ, không làm tắt, làm ẩu dễ xảy ra mất an toàn. Thực hiện ở đâu có bộ đội, ở đó có người chỉ huy, khi hoàn thành nhiệm vụ phải tổ chức rút kinh nghiệm, tìm ra nguyên nhân mạnh, yếu để trau dồi kinh nghiệm trong quản lý chỉ huy và trong thực hiện các nhiệm vụ tiếp theo", "c) Chú động đưa khoa học kỹ thuật vào tăng gia sản xuất, nghiêm cấm việc cử chiến sĩ đi xin vật liệu, xin tre, phân", "d) Bảo đảm tốt vật chất, trang bị hậu cần, kỹ thuật cho các nhiệm vụ"], "answer": "b) Trong thực hiện nhiệm vụ Huấn luyện: cán bộ trực tiếp huấn luyện, giảng dạy khi lên lớp không được sử dụng điện thoại; phải huấn luyện thành thạo động tác, nắm vững tính năng, kỹ chiến thuật khi sử dụng các loại vũ khí, trang bị. Khi sử dụng thuốc nổ, phải giám sát chặt chẽ, không làm tắt, làm ẩu dễ xảy ra mất an toàn. Thực hiện ở đâu có bộ đội, ở đó có người chỉ huy, khi hoàn thành nhiệm vụ phải tổ chức rút kinh nghiệm, tìm ra nguyên nhân mạnh, yếu để trau dồi kinh nghiệm trong quản lý chỉ huy và trong thực hiện các nhiệm vụ tiếp theo"}, {"question": "Câu 7. Theo Chỉ thị số 123/CT-QK ngày 13/01/2026 của Tư lệnh Quân khu 4, nội dung thứ 6 của chỉ thị quy định về:", "options": ["a) Phải thường xuyên củng cố cảnh quan, xây dựng môi trường chính quy, xanh, sạch, đẹp. Tập trung trồng những cây xanh có tính chất lâu dài, đồng bộ từng khu vực, không nên trồng manh mún mà phải trồng bảo đảm thống nhất, đồng bộ, đẹp. Tổ chức tốt các hoạt động vui chơi, giải trí lành mạnh trong các ngày nghỉ, giờ nghỉ, với nhiều hình thức phong phú, tạo sự gắn bó với đơn vị", "b) Đưa khoa học kỹ thuật vào tăng gia sản xuất (các hệ thống vườn, giàn phun, tưới tự động)", "c) Quản lý chặt chẽ hệ thốn let current=[];
let index=0;
let mode="";

function shuffle(a){
 return a.sort(()=>Math.random()-0.5);
}

function prepare(){
 return shuffle([...questions]).map(q=>({
   ...q,
   opts:shuffle([...q.options])
 }));
}

// Chế độ từng câu
function startSingle(){
 mode="single";
 current=prepare();
 index=0;
 showSingle();
}

function showSingle(){
 if(index>=current.length){
   document.getElementById("quiz").innerHTML="<h2>Đã hoàn thành toàn bộ câu hỏi</h2>";
   return;
 }
 let q=current[index];
 let html=`<div class="question">
 <h3>Câu ${index+1}/${current.length}</h3>
 <b>${q.question}</b>`;

 q.opts.forEach((o,i)=>{
 html+=`<label class="option" onclick="checkSingle(this,'${o.replace(/'/g,"\\'")}','${q.answer.replace(/'/g,"\\'")}')">${o}</label>`;
 });

 html+="</div>";
 document.getElementById("quiz").innerHTML=html;
}

function checkSingle(el,chosen,answer){
 let opts=document.querySelectorAll(".option");
 opts.forEach(o=>{
   if(o.innerText==answer)o.classList.add("correct");
 });

 if(chosen==answer){
   document.getElementById("result").innerHTML="✅ Chính xác!";
 }else{
   el.classList.add("wrong");
   document.getElementById("result").innerHTML="❌ Sai. Đáp án đúng đã được tô xanh.";
 }

 setTimeout(()=>{
   document.getElementById("result").innerHTML="";
   index++;
   showSingle();
 },1200);
}


// Chế độ làm toàn bộ bài
function startAll(){
 mode="all";
 current=prepare();

 let html="";
 current.forEach((q,i)=>{
 html+=`<div class="question">
 <b>${i+1}. ${q.question}</b>`;
 q.opts.forEach((o,j)=>{
 html+=`<label class="option">
 <input type="radio" name="q${i}" value="${j}">
 ${o}
 </label>`;
 });
 html+="</div>";
 });

 html+=`<button onclick="submitAll()">Nộp bài</button>`;
 document.getElementById("quiz").innerHTML=html;
}

function submitAll(){
 let score=0;

 current.forEach((q,i)=>{
 let labels=document.querySelectorAll(".question")[i].querySelectorAll(".option");
 labels.forEach((l,j)=>{
   if(q.opts[j]==q.answer) l.classList.add("correct");
 });

 let s=document.querySelector(`input[name="q${i}"]:checked`);
 if(s && q.opts[s.value]==q.answer) score++;
 else if(s) labels[s.value].classList.add("wrong");
 });

 document.getElementById("result").innerHTML=
 "🎯 Kết quả: "+score+"/"+current.length+" câu đúng";
}
</script>
